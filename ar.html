<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>IM3CB | Visor 3D</title>

  <!-- Visor 3D de Google -->
  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js">
  </script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      text-align: center;
    }

    header {
      background: #0F0F1A;
      color: white;
      padding: 18px;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    .contenedor {
      max-width: 800px;
      margin: auto;
      padding: 20px;
    }

    .cargar {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    input[type="file"] {
      margin-top: 10px;
    }

    model-viewer {
      width: 100%;
      height: 500px;
      background: #e8eaed;
      border-radius: 12px;
      display: none;
    }

    #nombreArchivo {
      margin-top: 10px;
      font-weight: bold;
      color: #2979FF;
    }
  </style>
</head>

<body>

<header>
  <h1>IM3CB | Visor de modelos 3D</h1>
  <p>Ingeniería · Creación · Diseño · Innovación</p>
</header>

<div class="contenedor">

  <div class="cargar">
    <h2>Carga tu modelo CAD</h2>

    <p>Selecciona un archivo en formato GLB.</p>

    <input
      type="file"
      id="archivo"
      accept=".glb,model/gltf-binary">

    <div id="nombreArchivo"></div>
  </div>

<model-viewer
  id="visor"
  camera-controls
  auto-rotate
  shadow-intensity="1"
  environment-image="neutral"
  ar
  ar-modes="webxr scene-viewer quick-look">
</model-viewer>

</div>

<script>
  const archivo = document.getElementById("archivo");
  const visor = document.getElementById("visor");
  const nombreArchivo = document.getElementById("nombreArchivo");

  let urlAnterior = null;

  archivo.addEventListener("change", function () {

    const file = this.files[0];

    if (!file) return;

    if (!file.name.toLowerCase().endsWith(".glb")) {
      alert("Selecciona un archivo GLB.");
      this.value = "";
      return;
    }

    if (urlAnterior) {
      URL.revokeObjectURL(urlAnterior);
    }

    urlAnterior = URL.createObjectURL(file);

    visor.src = urlAnterior;
    visor.style.display = "block";

    nombreArchivo.textContent = "Modelo cargado: " + file.name;
  });
</script>

</body>
</html>
